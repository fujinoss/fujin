[package]
name = "arashi"
version = "0.95.0"
edition = "2021"
license = "MIT"
authors = ["fujinoss"]
description = "GPU renderer for Fujin"
repository = "https://github.com/fujinoss/fujin"

[lib]
name = "arashi"
crate-type = ["staticlib", "rlib"]

[dependencies]
ash = "0.38"
raw-window-handle = "0.6"
bytemuck = { version = "1.14", features = ["derive"] }
log = "0.4"
once_cell = "1.19"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
